<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FaceNet — TDT03</title>
<style>
  :root { --ink:#1d1d1f; --mute:#6e6e73; --line:#d8d8dc; --acc:#6b2fb3; --bar:#ffffffe6; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ink:#e9e9e4; --mute:#9a9a94; --line:#3a3a40; --bar:#1e1e24e6; } }
  :root[data-theme="dark"] { --ink:#e9e9e4; --mute:#9a9a94; --line:#3a3a40; --bar:#1e1e24e6; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; font: 14px/1.4 system-ui, sans-serif; color: var(--ink); }
  #stage { position: fixed; inset: 0; cursor: grab; user-select: none; touch-action: none; background: #fff; }
  #stage.dragging { cursor: grabbing; }
  #stage svg { width: 100%; height: 100%; display: block; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; color: #6e6e73; }
  #bar { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px;
         max-width: calc(100% - 32px); padding: 6px 8px; border: 1px solid var(--line); border-radius: 10px;
         background: var(--bar); backdrop-filter: blur(6px); box-shadow: 0 2px 10px #0002; }
  body.nobar #bar { display: none; }
  #bar button { font: 15px system-ui, sans-serif; width: 34px; height: 30px; border: 1px solid var(--line); border-radius: 7px;
                background: transparent; color: var(--ink); cursor: pointer; flex: none; }
  #bar button:hover { border-color: var(--acc); color: var(--acc); }
  #num { color: var(--mute); font-variant-numeric: tabular-nums; white-space: nowrap; }
  #title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  #free { color: var(--acc); font-size: 12px; white-space: nowrap; display: none; }
  body.free #free { display: inline; }
  #help { position: fixed; top: 12px; right: 12px; font-size: 12px; color: #6e6e73; background: #ffffffd9;
          border: 1px solid #d8d8dc; border-radius: 8px; padding: 6px 9px; max-width: calc(100% - 24px); }
  body.nobar #help { display: none; }
  kbd { font: 11px ui-monospace, monospace; border: 1px solid #d8d8dc; border-bottom-width: 2px; border-radius: 3px; padding: 0 4px; background: #fff; color: #1d1d1f; }
  @media (max-width: 600px) { #help { display: none; } }
</style></head>
<body>
<div id="stage"><div id="loading">loading canvas…</div></div>
<div id="help"><kbd>←</kbd><kbd>→</kbd> slides · scroll / drag to explore · <kbd>R</kbd> back to slide · <kbd>H</kbd> hide bar</div>
<div id="bar"><button id="prev" aria-label="previous slide">◀</button><span id="num"></span><span id="title"></span>
  <span id="free">free view · R</span><button id="next" aria-label="next slide">▶</button></div>

<script>
// Built by tools/export-pages.py from slides.md: titles, camera frames and transitions only.
const SLIDES = [{"title": "Overview", "frame": [60.0, 50.0, 1380.0, 940.0], "via": [], "transition": null, "duration": null}, {"title": "Inference pipeline Intro", "frame": [-78.3, 379.2, 814.7, 576.6], "via": [], "transition": null, "duration": null}, {"title": "Modification of latest layers", "frame": [95.0, 805.0, 330.0, 150.0], "via": [], "transition": null, "duration": null}, {"title": "Lets go step by step", "frame": [-242.4, -53.6, 1789.7, 1279.4], "via": [], "transition": null, "duration": 1.8}, {"title": "Input and face detection", "frame": [82.0, 367.2, 135.0, 110.0], "via": [], "transition": null, "duration": null}, {"title": "Crop", "frame": [170.0, 402.2, 95.0, 65.0], "via": [], "transition": null, "duration": null}, {"title": "Resize to 224\u00d7224", "frame": [254.0, 404.2, 60.0, 42.0], "via": [], "transition": null, "duration": null}, {"title": "Different Architectures", "frame": [300.0, 344.2, 122.0, 62.0], "via": [], "transition": null, "duration": null}, {"title": "The backbone", "frame": [216.4, 343.1, 390.0, 278.8], "via": [], "transition": null, "duration": null}, {"title": "The output", "frame": [304.0, 776.6, 352.4, 251.9], "via": [], "transition": null, "duration": null}, {"title": "Training pipeline", "frame": [556.9, 540.3, 424.5, 303.4], "via": [], "transition": null, "duration": null}, {"title": "Triplets visualization", "frame": [586.5, 383.5, 794.7, 612.7], "via": [], "transition": null, "duration": null}, {"title": "Dataset", "frame": [781.0, 297.2, 461.4, 355.7], "via": [], "transition": null, "duration": null}, {"title": "Ablations", "frame": [843.7, 43.9, 363.4, 280.1], "via": [], "transition": null, "duration": null}, {"title": "Identification threshold", "frame": [343.8, 804.7, 325.6, 251.1], "via": [], "transition": null, "duration": null}, {"title": "The end", "frame": [59.2, 46.9, 1301.7, 1003.6], "via": [], "transition": null, "duration": null}];
const PAD = 0.06, RHO = Math.SQRT2, DUR_MIN = 550, DUR_MAX = 2200, MS_PER_S = 420;
const $ = id => document.getElementById(id), stage = $('stage');
let cur = 0, svg = null, vb = null, anim = null, free = false;

const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;

function fit(f) {   // pad the frame, then grow it to the stage's aspect so nothing is cropped
  const [x, y, w, h] = f, W = stage.clientWidth || 1, H = stage.clientHeight || 1;
  let pw = w * (1 + 2*PAD), ph = h * (1 + 2*PAD);
  if (pw / ph < W / H) pw = ph * W / H; else ph = pw * H / W;
  return [x + w/2 - pw/2, y + h/2 - ph/2, pw, ph];
}
function setVB(v) { vb = v; svg && svg.setAttribute('viewBox', v.map(n => n.toFixed(2)).join(' ')); }

// Smooth zoom (van Wijk & Nuij 2003): pulls back on long moves, near-straight on short ones.
function zoomLeg(a, b, straight) {
  const w0 = a[2], w1 = b[2], x0 = a[0] + a[2]/2, y0 = a[1] + a[3]/2;
  const dx = b[0] + b[2]/2 - x0, dy = b[1] + b[3]/2 - y0, r0h = a[3]/a[2], r1h = b[3]/b[2];
  const view = (u, w) => { const h = w * (r0h + (r1h - r0h) * u); return [x0 + u*dx - w/2, y0 + u*dy - h/2, w, h]; };
  const d2 = dx*dx + dy*dy, d1 = Math.sqrt(d2), rho2 = RHO*RHO;
  if (straight) {
    const S = Math.max(Math.abs(Math.log(w1 / w0)), d1 / Math.min(w0, w1)) / RHO;
    return { S, at: s => { const u = S ? s / S : 1; return view(u, w0 + (w1 - w0) * u); } };
  }
  if (d1 < 1e-6 * Math.max(w0, w1)) {
    const S = Math.log(w1 / w0) / RHO;
    return { S: Math.abs(S), at: s => view(S ? s / Math.abs(S) : 1, w0 * Math.exp(RHO * Math.sign(S) * s)) };
  }
  const b0 = (w1*w1 - w0*w0 + rho2*rho2*d2) / (2*w0*rho2*d1);
  const b1 = (w1*w1 - w0*w0 - rho2*rho2*d2) / (2*w1*rho2*d1);
  const r0 = Math.log(Math.sqrt(b0*b0 + 1) - b0), r1 = Math.log(Math.sqrt(b1*b1 + 1) - b1);
  const S = (r1 - r0) / RHO, c0 = Math.cosh(r0);
  return { S, at: s => {
    const u = w0 / (rho2*d1) * (c0 * Math.tanh(RHO*s + r0) - Math.sinh(r0));
    return view(u, w0 * c0 / Math.cosh(RHO*s + r0));
  } };
}
function plan(from, targets, straight) {
  const legs = [];
  for (const t of targets) { legs.push(zoomLeg(from, t, straight)); from = t; }
  const total = legs.reduce((a, l) => a + l.S, 0);
  return { legs, total, auto: Math.max(DUR_MIN, Math.min(DUR_MAX, total * MS_PER_S * (targets.length > 1 ? 1.25 : 1))) };
}
function along(p, s) {
  let i = 0;
  while (i < p.legs.length - 1 && s > p.legs[i].S) { s -= p.legs[i].S; i++; }
  return p.legs[i].at(Math.min(s, p.legs[i].S));
}
function flyTo(targets, dur, straight = false) {
  cancelAnimationFrame(anim);
  const last = targets[targets.length - 1];
  if (!vb || dur === 0) return setVB(last);
  const p = plan(vb.slice(), targets, straight);
  if (!(p.total > 1e-9)) return setVB(last);
  if (dur == null) dur = p.auto;
  const t0 = performance.now();
  const step = now => {
    const k = Math.min(1, (now - t0) / dur);
    setVB(k < 1 ? along(p, ease(k) * p.total) : last);
    if (k < 1) anim = requestAnimationFrame(step);
  };
  anim = requestAnimationFrame(step);
}

function setFree(on) { free = on; document.body.classList.toggle('free', on); }

// Keyframes live on the slide they lead into; going back one slide runs them in reverse.
function go(n, dur) {
  n = Math.max(0, Math.min(SLIDES.length - 1, n));
  const prev = cur, s = SLIDES[n];
  cur = n; setFree(false);
  let via = [], owner = s;
  if (n === prev + 1) via = s.via || [];
  else if (n === prev - 1) { owner = SLIDES[prev]; via = (owner.via || []).slice().reverse(); }
  if (dur == null && owner.duration) dur = owner.duration * 1000;
  if (s.frame) flyTo([...via.map(fit), fit(s.frame)], dur, owner.transition === 'straight');
  $('num').textContent = `${n + 1} / ${SLIDES.length}`;
  $('title').textContent = s.title;
  history.replaceState(null, '', '#' + (n + 1));
}

addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  switch (e.key) {
    case 'ArrowRight': case 'ArrowDown': case ' ': case 'PageDown': go(cur + 1); break;
    case 'ArrowLeft': case 'ArrowUp': case 'PageUp': go(cur - 1); break;
    case 'Home': go(0); break;
    case 'End': go(SLIDES.length - 1); break;
    case 'r': case 'R': go(cur); break;
    case 'h': case 'H': document.body.classList.toggle('nobar'); break;
    default: return;
  }
  e.preventDefault();
});
for (const [id, d] of [['prev', -1], ['next', 1]]) {
  $(id).addEventListener('click', () => go(cur + d));
  $(id).addEventListener('mousedown', e => e.preventDefault());
}

// Free exploration: wheel / pinch zooms, drag pans; R (or any slide change) snaps back.
function toCanvas(px, py) {
  const r = stage.getBoundingClientRect();
  const s = Math.max(vb[2] / r.width, vb[3] / r.height);        // meet: the larger scale wins
  const ox = (r.width * s - vb[2]) / 2, oy = (r.height * s - vb[3]) / 2;
  return [vb[0] - ox + (px - r.left) * s, vb[1] - oy + (py - r.top) * s];
}
function zoomAt(px, py, k) {
  const [cx, cy] = toCanvas(px, py);
  setVB([cx - (cx - vb[0]) * k, cy - (cy - vb[1]) * k, vb[2] * k, vb[3] * k]);
}
stage.addEventListener('wheel', e => {
  if (!vb) return;
  e.preventDefault(); cancelAnimationFrame(anim); setFree(true);
  zoomAt(e.clientX, e.clientY, Math.exp(e.deltaY * 0.0015));
}, { passive: false });

const ptrs = new Map();
let drag = null, pinch = null, tap = null;
stage.addEventListener('pointerdown', e => {
  if (!vb) return;
  stage.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 1) { drag = { x: e.clientX, y: e.clientY, vb: vb.slice() }; tap = { x: e.clientX, y: e.clientY, t: performance.now() }; }
  else if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) }; drag = null; tap = null;
  }
  stage.classList.add('dragging');
});
stage.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && ptrs.size === 2) {
    const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
    cancelAnimationFrame(anim); setFree(true);
    zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, pinch.d / d); pinch.d = d;
  } else if (drag) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) < 6) return;
    tap = null; cancelAnimationFrame(anim); setFree(true);
    const r = stage.getBoundingClientRect(), s = Math.max(drag.vb[2] / r.width, drag.vb[3] / r.height);
    setVB([drag.vb[0] - dx * s, drag.vb[1] - dy * s, drag.vb[2], drag.vb[3]]);
  }
});
function up(e) {
  ptrs.delete(e.pointerId);
  if (tap && ptrs.size === 0 && performance.now() - tap.t < 400) {   // tap: right two thirds = next, left third = back
    go(cur + (tap.x > innerWidth / 3 ? 1 : -1));
  }
  if (ptrs.size < 2) pinch = null;
  if (ptrs.size === 0) { drag = null; tap = null; stage.classList.remove('dragging'); }
}
stage.addEventListener('pointerup', up);
stage.addEventListener('pointercancel', up);

addEventListener('resize', () => { if (!free && SLIDES[cur].frame) { cancelAnimationFrame(anim); setVB(fit(SLIDES[cur].frame)); } });

(async () => {
  const text = await (await fetch('canvas.svg')).text();
  svg = document.importNode(new DOMParser().parseFromString(text, 'image/svg+xml').documentElement, true);
  svg.removeAttribute('width'); svg.removeAttribute('height');
  svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
  $('loading').remove(); stage.prepend(svg);
  const n = parseInt(location.hash.slice(1), 10);
  go(isNaN(n) ? 0 : n - 1, 0);
})();
</script>
</body></html>
